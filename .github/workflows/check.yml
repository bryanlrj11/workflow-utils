name: check

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      source:
        default: ""

permissions:
  contents: read

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  gate:
    # GitHub's cron is the backup for the timer (deploy/trigger in the source repo): a
    # scheduled run goes ahead only when no other run of this workflow started recently.
    if: github.event_name == 'schedule' && vars.CHECK_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      go: ${{ steps.recent.outputs.go }}
    steps:
      - id: recent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-25 minutes' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?created=%3E$since" -q "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)] | length" || echo 0)
          echo "go=$([ "$n" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  run:
    needs: gate
    # manual dispatch always; the timer and the backup cron only while CHECK_ENABLED is true
    if: >-
      always() && (needs.gate.outputs.go == 'true'
      || (github.event_name == 'workflow_dispatch' && (inputs.source != 'timer' || vars.CHECK_ENABLED == 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Fetch
        env:
          DEPLOY_KEY: ${{ secrets.SOURCE_KEY }}
        run: bash scripts/fetch.sh "${{ secrets.SOURCE_REPO }}" src a

      - name: Restore state
        uses: actions/cache/restore@v5
        with:
          path: src/data/live
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check
        id: due
        working-directory: src
        run: |
          if bash deploy/jobs/check.sh check > "$RUNNER_TEMP/run.log" 2>&1; then
            echo "ok"
          else
            echo "failed ($?)"
            exit 1
          fi

      - uses: actions/setup-python@v6
        if: steps.due.outputs.due == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/deploy/jobs/a.txt

      - name: Run
        if: steps.due.outputs.due == 'true'
        working-directory: src
        env:
          COCKROACH_DSN: ${{ secrets.COCKROACH_DSN }}
          PAID_PROXIES: ${{ secrets.PROXIES }}
          PYTHONUNBUFFERED: "1"
        run: |
          if bash deploy/jobs/check.sh fetch >> "$RUNNER_TEMP/run.log" 2>&1; then
            echo "ok"
          else
            echo "failed ($?)"
            exit 1
          fi

      - name: Save state
        if: always() && steps.due.outputs.due == 'true'
        uses: actions/cache/save@v5
        with:
          path: src/data/live
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report
        if: failure()
        env:
          DEPLOY_KEY: ${{ secrets.LOGS_KEY }}
        run: bash scripts/report.sh "${{ secrets.LOGS_REPO }}" "$RUNNER_TEMP/run.log"
