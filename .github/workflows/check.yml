name: check

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.CHECK_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch
        env:
          DEPLOY_KEY: ${{ secrets.SOURCE_KEY }}
        run: bash scripts/fetch.sh "${{ secrets.SOURCE_REPO }}" src a

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: src/data/live
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check
        id: due
        working-directory: src
        run: |
          if bash deploy/jobs/check.sh check > "$RUNNER_TEMP/run.log" 2>&1; then
            echo "ok"
          else
            echo "failed ($?)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: steps.due.outputs.due == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/deploy/jobs/a.txt

      - name: Run
        if: steps.due.outputs.due == 'true'
        working-directory: src
        env:
          COCKROACH_DSN: ${{ secrets.COCKROACH_DSN }}
          PAID_PROXIES: ${{ secrets.PROXIES }}
          PYTHONUNBUFFERED: "1"
        run: |
          if bash deploy/jobs/check.sh fetch >> "$RUNNER_TEMP/run.log" 2>&1; then
            echo "ok"
          else
            echo "failed ($?)"
            exit 1
          fi

      - name: Save state
        if: always() && steps.due.outputs.due == 'true'
        uses: actions/cache/save@v4
        with:
          path: src/data/live
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report
        if: failure()
        env:
          DEPLOY_KEY: ${{ secrets.LOGS_KEY }}
        run: bash scripts/report.sh "${{ secrets.LOGS_REPO }}" "$RUNNER_TEMP/run.log"
