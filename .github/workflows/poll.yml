name: poll

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      source:
        default: ""
      window:
        default: "25"
      extra:
        type: choice
        options: [auto, "yes", "no"]
        default: auto

permissions:
  contents: read

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  gate:
    # GitHub's cron is the backup for the timer (deploy/trigger in the source repo): a
    # scheduled run goes ahead only when no other run of this workflow started recently.
    if: github.event_name == 'schedule' && vars.POLL_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      go: ${{ steps.recent.outputs.go }}
    steps:
      - id: recent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-25 minutes' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/poll.yml/runs?created=%3E$since" -q "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)] | length" || echo 0)
          echo "go=$([ "$n" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  run:
    needs: gate
    # manual dispatch always; the timer and the backup cron only while POLL_ENABLED is true
    if: >-
      always() && (needs.gate.outputs.go == 'true'
      || (github.event_name == 'workflow_dispatch' && (inputs.source != 'timer' || vars.POLL_ENABLED == 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Fetch
        env:
          DEPLOY_KEY: ${{ secrets.SOURCE_KEY }}
        run: bash scripts/fetch.sh "${{ secrets.SOURCE_REPO }}" src b

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/deploy/jobs/b.txt

      - name: Run
        working-directory: src
        env:
          COCKROACH_DSN: ${{ secrets.COCKROACH_DSN }}
          WATCH_MINUTES: ${{ inputs.window || '25' }}
          OUTRIGHTS: ${{ inputs.extra || 'auto' }}
          PYTHONUNBUFFERED: "1"
        run: |
          if bash deploy/jobs/poll.sh > "$RUNNER_TEMP/run.log" 2>&1; then
            echo "ok"
          else
            echo "failed ($?)"
            exit 1
          fi

      - name: Report
        if: failure()
        env:
          DEPLOY_KEY: ${{ secrets.LOGS_KEY }}
        run: bash scripts/report.sh "${{ secrets.LOGS_REPO }}" "$RUNNER_TEMP/run.log"
