# Scheduled workflows in a public repository are disabled after 60 days without
# activity; commit a date stamp when the last commit is over 30 days old.
name: keepalive

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -lt $((30 * 86400)) ]; then
            echo "recent"
            exit 0
          fi
          date -u +%F > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -q -m "keepalive"
          git push -q
